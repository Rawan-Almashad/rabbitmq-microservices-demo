<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Registration</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f0f0f0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; width: 100%; }
        .success { color: green; margin-top: 10px; }
        .error { color: red; margin-top: 10px; }
        h1 { color: #333; }
    </style>
</head>
<body>
<div class="container">
    <h1>User Registration</h1>

    <div th:if="${success}" class="success" th:text="${message}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form action="/register" method="post" th:object="${user}">
        <div class="form-group">
            <label>First Name:</label>
            <input type="text" th:field="*{firstname}" required>
        </div>

        <div class="form-group">
            <label>Last Name:</label>
            <input type="text" th:field="*{lastname}" required>
        </div>

        <div class="form-group">
            <label>Username:</label>
            <input type="text" th:field="*{username}" required>
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" th:field="*{password}" required>
        </div>

        <button type="submit">Register</button>
    </form>

    <p style="margin-top: 20px;"><a href="/users">View All Users</a></p>
</div>
</body>
</html>
