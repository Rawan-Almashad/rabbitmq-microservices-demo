<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Messages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .message {
            background: #f9f9f9;
            border-left: 4px solid #4CAF50;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }
        .message-id {
            color: #999;
            font-size: 12px;
        }
        .message-content {
            margin-top: 5px;
            color: #333;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Messages from Queue</h1>

    <!-- Fixed: Use standard dot notation, not ?. -->
    <div th:each="msg : ${messages}" class="message">
        <div class="message-id">Message #<span th:text="${msg.id}"></span></div>
        <div class="message-content" th:text="${msg.content}"></div>
    </div>
</div>
</body>
</html>
