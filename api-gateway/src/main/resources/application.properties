spring.application.name=api-gateway

server.port=8080


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


spring.cloud.gateway.routes[0].id=producer
spring.cloud.gateway.routes[0].uri=lb://producer
spring.cloud.gateway.routes[0].predicates[0]=Path=/producer/**

spring.cloud.gateway.routes[1].id=consumer
spring.cloud.gateway.routes[1].uri=lb://consumer
spring.cloud.gateway.routes[1].predicates[0]=Path=/consumer/**

spring.cloud.gateway.routes[2].id=frontend
spring.cloud.gateway.routes[2].uri=lb://frontend
spring.cloud.gateway.routes[2].predicates[0]=Path=/frontend/**
spring.cloud.gateway.routes[2].predicates[1]=Path=/frontend

logging.level.org.spri
gframework.cloud.gateway=DEBUG

management.endpoints.web.exposure.include=*