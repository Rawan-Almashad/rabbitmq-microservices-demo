version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8
    container_name: mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webapp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql2:
    image: mysql:8
    container_name: mysql2
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webapp2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  producer:
    build: ./producer
    container_name: producer
    ports:
      - "8082:8082"
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=producer
      - eureka.instance.ip-address=producer
      - spring.rabbitmq.host=rabbitmq
      - spring.datasource.url=jdbc:mysql://mysql:3306/webapp
      - spring.datasource.username=root
      - spring.datasource.password=root
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy

  consumer:
    build: ./consumer
    container_name: consumer
    ports:
      - "8083:8083"
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=consumer
      - eureka.instance.ip-address=consumer
      - spring.rabbitmq.host=rabbitmq
      - spring.datasource.url=jdbc:mysql://mysql2:3306/webapp2
      - spring.datasource.username=root
      - spring.datasource.password=root
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql2:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8081:8081"
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=frontend
      - eureka.instance.ip-address=frontend
    depends_on:
      eureka-server:
        condition: service_healthy
      producer:
        condition: service_started
      consumer:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=api-gateway
      - eureka.instance.ip-address=api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy