version: '3.8'

services:
  # RabbitMQ - Message broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # Producer Service
  producer:
    build: ./producer
    container_name: producer
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq

  # Consumer Service
  consumer:
    build: ./consumer
    container_name: consumer
    ports:
      - "8082:8082"
    depends_on:
      - rabbitmq