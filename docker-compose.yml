version: '3.8'

services:
  # RabbitMQ - Message broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  producer:
    build: ./producer
    container_name: producer
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq

  consumer:
    build: ./consumer
    container_name: consumer
    ports:
      - "8082:8082"
    depends_on:
      - rabbitmq

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8081:8081"
    depends_on:
      - producer
      - consumer